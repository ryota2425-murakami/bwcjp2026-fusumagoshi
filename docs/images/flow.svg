  <text class="k" x="78" y="434" font-size="15" font-weight="600" fill="#857a6e">祖母の声(橙)と、相手の時間(藍の点)</text>
  <text class="m" x="78" y="514" font-size="19" font-weight="600" fill="#24201c">聞くのは祖母の声と「間」だけ。</text>
  <text class="m" x="78" y="542" font-size="19" font-weight="600" fill="#24201c">相手の声は聞かない。</text>
  <text class="m" x="78" y="570" font-size="19" font-weight="600" fill="#24201c">音は Mac の中だけで扱う。</text>
  <text class="k" x="78" y="622" font-size="15" font-weight="600" fill="#857a6e">YAMNet・Silero VAD・whisper.cpp・Praat</text>
</g>
<g><rect x="434" y="96" width="358" height="552" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="470" cy="146" r="19" fill="none" stroke="#24201c" stroke-width="2"/>
  <text class="m" x="470" y="154" font-size="22" font-weight="800" fill="#24201c" text-anchor="middle">2</text>
  <text class="m" x="500" y="155" font-size="26" font-weight="800" fill="#24201c">電話のあとに一言</text>
  <rect x="478" y="197" width="66" height="120" fill="#e99a3c" fill-opacity="0.55" stroke="#24201c" stroke-width="2"/><path d="M511 197V317M478 237H544M478 277H544" stroke="#24201c" stroke-opacity=".55" stroke-width="1.5"/><rect x="475" y="197" width="5" height="120" fill="#4a423a"/><rect x="542" y="197" width="5" height="120" fill="#4a423a"/><rect x="473" y="188" width="76" height="9" rx="2" fill="#4a423a"/><rect x="473" y="317" width="76" height="9" rx="2" fill="#4a423a"/><rect x="480" y="326" width="7" height="10" fill="#4a423a"/><rect x="535" y="326" width="7" height="10" fill="#4a423a"/>
  <text class="k" x="574" y="230" font-size="20" font-weight="600" fill="#24201c">「そういえば、</text>
  <text class="k" x="574" y="260" font-size="20" font-weight="600" fill="#24201c">さっきの電話、</text>
  <text class="k" x="574" y="290" font-size="20" font-weight="600" fill="#24201c">なんだったの?」</text>
  <text class="k" x="574" y="322" font-size="15" font-weight="600" fill="#857a6e">最初の一言は、いつも同じ</text>
  <text class="m" x="462" y="390" font-size="17" font-weight="700" fill="#4a423a">ひとつずつ聞く</text>
  <text class="k" x="462" y="418" font-size="18" font-weight="600" fill="#24201c">一 さっきの電話のこと</text>
  <text class="k" x="462" y="444" font-size="18" font-weight="600" fill="#24201c">二 家族に話していい?</text>
  <text class="k" x="462" y="470" font-size="18" font-weight="600" fill="#24201c">三 いつもの話へ</text>
  <text class="m" x="462" y="514" font-size="19" font-weight="600" fill="#24201c">電話が終わって、少したってから。</text>
  <text class="m" x="462" y="542" font-size="19" font-weight="600" fill="#24201c">問い詰めず、一度にひとつ。</text>
  <text class="k" x="462" y="622" font-size="15" font-weight="600" fill="#857a6e">まとめ役 Sonnet 5.5・声は Mac の中で合成</text>
</g>
<g><rect x="818" y="96" width="358" height="552" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="854" cy="146" r="19" fill="none" stroke="#24201c" stroke-width="2"/>
  <text class="m" x="854" y="154" font-size="22" font-weight="800" fill="#24201c" text-anchor="middle">3</text>
  <text class="m" x="884" y="155" font-size="26" font-weight="800" fill="#24201c">記憶でつなぐ</text>
  <g><rect x="862" y="182" width="290" height="86" rx="2" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="k" x="876" y="206" font-size="15" font-weight="600" fill="#857a6e">前の電話・10月30日(7 日前)</text>
  <text class="k" x="876" y="232" font-size="16" font-weight="600" fill="#24201c">同じ「はるかぜ健康」から。</text>
  <text class="k" x="876" y="256" font-size="16" font-weight="600" fill="#24201c">断って、自分から切っていた。</text>
</g>
  <rect x="978" y="174" width="58" height="16" fill="#e99a3c" fill-opacity=".32" transform="rotate(-4 1007 182)"/>
  <g><rect x="862" y="282" width="290" height="86" rx="2" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="k" x="876" y="306" font-size="15" font-weight="600" fill="#857a6e">おしゃべり・11月4日(2 日前)</text>
  <text class="k" x="876" y="332" font-size="16" font-weight="600" fill="#24201c">「それがね、最近、膝が痛くて。</text>
  <text class="k" x="876" y="356" font-size="16" font-weight="600" fill="#24201c">階段がつらいな。」</text>
</g>
  <rect x="978" y="274" width="58" height="16" fill="#e99a3c" fill-opacity=".32" transform="rotate(3 1007 282)"/>
  <g><rect x="862" y="386" width="290" height="64" rx="2" fill="#fbf6ec" stroke="#c4432c" stroke-opacity="0.8" stroke-width="1.6"/>
  <text class="k" x="876" y="410" font-size="15" font-weight="600" fill="#c4432c">今日の電話</text>
  <text class="m" x="876" y="436" font-size="17" font-weight="700" fill="#24201c">膝のサプリ。毎月届く約束</text>
</g>
  <path d="M862 226C830 266,830 382,862 412" fill="none" stroke="#c4432c" stroke-width="2"/>
  <circle cx="862" cy="226" r="3.2" fill="#c4432c"/>
  <circle cx="862" cy="412" r="3.2" fill="#c4432c"/>
  <path d="M862 326C830 366,830 394,862 424" fill="none" stroke="#c4432c" stroke-width="2"/>
  <circle cx="862" cy="326" r="3.2" fill="#c4432c"/>
  <circle cx="862" cy="424" r="3.2" fill="#c4432c"/>
  <text class="m" x="846" y="514" font-size="19" font-weight="600" fill="#24201c">同じ相手の 2 度目と、</text>
  <text class="m" x="846" y="542" font-size="19" font-weight="600" fill="#24201c">膝の悩みとのつながりに気づく。</text>
  <text class="m" x="846" y="570" font-size="19" font-weight="600" fill="#24201c">文字起こしは消し、要約だけ残す。</text>
  <text class="k" x="846" y="622" font-size="15" font-weight="600" fill="#857a6e">通話カルテ・暮らしのメモ(Mac の中)</text>
</g>
<g><rect x="1202" y="96" width="358" height="552" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="1238" cy="146" r="19" fill="none" stroke="#24201c" stroke-width="2"/>
  <text class="m" x="1238" y="154" font-size="22" font-weight="800" fill="#24201c" text-anchor="middle">4</text>
  <text class="m" x="1268" y="155" font-size="26" font-weight="800" fill="#24201c">家族に便り 18:00</text>
  <rect x="1232" y="188" width="110" height="236" rx="18" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.9" stroke-width="2.6"/>
  <path d="M1272 201H1302" stroke="#24201c" stroke-width="2" stroke-linecap="round"/>
  <rect x="1241" y="212" width="92" height="192" rx="6" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.3" stroke-width="1.2"/>
  <text class="m" x="1250" y="244" font-size="13" font-weight="700" fill="#24201c">膝のサプリの</text>
  <text class="m" x="1250" y="261" font-size="13" font-weight="700" fill="#24201c">お電話が</text>
  <text class="m" x="1250" y="278" font-size="13" font-weight="700" fill="#24201c">ありました</text>
  <path d="M1250 310H1324" stroke="#857a6e" stroke-opacity=".6" stroke-width="1.4"/>
  <path d="M1250 324H1324" stroke="#857a6e" stroke-opacity=".6" stroke-width="1.4"/>
  <path d="M1250 338H1324" stroke="#857a6e" stroke-opacity=".6" stroke-width="1.4"/>
  <rect x="1248" y="352" width="78" height="40" rx="4" fill="#e99a3c" fill-opacity="0.22"/>
  <circle cx="1344" cy="206" r="25" fill="#fbf6ec" fill-opacity=".85" stroke="#c4432c" stroke-width="2.2"/>
  <text class="k" x="1344" y="212" font-size="14" font-weight="600" fill="#c4432c" text-anchor="middle">18:00</text>
  <text class="k" x="1362" y="262" font-size="15" font-weight="600" fill="#857a6e">話しかけ方の例</text>
  <text class="k" x="1362" y="292" font-size="16" font-weight="600" fill="#24201c">「膝の具合どう?</text>
  <text class="k" x="1362" y="318" font-size="16" font-weight="600" fill="#24201c">今日サプリの電話が</text>
  <text class="k" x="1362" y="344" font-size="16" font-weight="600" fill="#24201c">あったって聞いたよ。</text>
  <text class="k" x="1362" y="370" font-size="16" font-weight="600" fill="#24201c">一緒に見てみようか。」</text>
  <text class="m" x="1230" y="514" font-size="19" font-weight="600" fill="#24201c">警報ではなく、電話をかける</text>
  <text class="m" x="1230" y="542" font-size="19" font-weight="600" fill="#24201c">きっかけと話し方を届ける。</text>
  <text class="m" x="1230" y="570" font-size="19" font-weight="600" fill="#24201c">採点役が合格にした便りだけ。</text>
  <text class="k" x="1230" y="622" font-size="15" font-weight="600" fill="#857a6e">Managed Agents・Sonnet 5.5・Outcomes</text>
</g>
