  <text class="m" x="116" y="155" font-size="26" font-weight="800" fill="#24201c">黙って聞く</text>
  <rect x="98" y="197" width="66" height="120" fill="#ebdfc8" fill-opacity="1" stroke="#24201c" stroke-width="2"/><path d="M131 197V317M98 237H164M98 277H164" stroke="#24201c" stroke-opacity=".55" stroke-width="1.5"/><rect x="95" y="197" width="5" height="120" fill="#4a423a"/><rect x="162" y="197" width="5" height="120" fill="#4a423a"/><rect x="93" y="188" width="76" height="9" rx="2" fill="#4a423a"/><rect x="93" y="317" width="76" height="9" rx="2" fill="#4a423a"/><rect x="100" y="326" width="7" height="10" fill="#4a423a"/><rect x="155" y="326" width="7" height="10" fill="#4a423a"/>
