<!-- 例は架空の通話 S05 と、その前の記憶(S00・R01)、2026-11-06 の収録(電話のあとの会話・夕方の便り)から -->
<text class="m" x="50" y="64" font-size="36" font-weight="800" fill="#24201c" letter-spacing=".06em">ふすまごしの一日</text>
<text class="k" x="370" y="64" font-size="17" font-weight="600" fill="#857a6e">例は架空の通話 S05(健康食品の電話勧誘・2 回目)。人物と会社は架空</text>
