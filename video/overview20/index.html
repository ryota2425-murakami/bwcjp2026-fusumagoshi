<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- 行灯の画面のみずち(Pi と同じ rig.js)。時刻だけから絵を決める -->
    <script src="assets/rig.js"></script>
    <script src="assets/drive.js"></script>
    <style>
      /* ふすまごし 概略 20 秒。地・墨・帯は台所の画面と同じ */
      :root {
        --ground: #f1f3f4;
        --ink: #14181b;
        --band: #1d4541;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #kitchen { z-index: 1; }
      #family { z-index: 2; }
      #ending { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.2" data-width="1920" data-height="1080">
      <!-- 台所の画面: 鳴る → 明細 → 判定 → 行灯が灯る -->
      <div id="kitchen" class="clip" data-composition-id="kitchen" data-composition-src="compositions/kitchen.html"
        data-start="0" data-duration="16.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 家族の画面: 夕方の便り -->
      <div id="family" class="clip" data-composition-id="family" data-composition-src="compositions/family.html"
        data-start="16.3" data-duration="4.1" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 結び -->
      <div id="ending" class="clip" data-composition-id="ending" data-composition-src="compositions/ending.html"
        data-start="20.4" data-duration="2.8" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
