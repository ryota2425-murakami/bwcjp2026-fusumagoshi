<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=540" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #F4F1EA; }
      #root { position: relative; width: 100%; height: 100%; }
      #loop-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 46%, #FBF8F1 0%, #F4F1EA 72%); }
      #loop-char { position: absolute; left: 175px; top: 70px; width: 610px; height: 431px; }
      #loop-char-in { position: absolute; inset: 0; }
      #loop-char-in svg { width: 100%; height: 100%; display: block; overflow: visible; }
    </style>
  </head>
  <body>
    <!-- README の小さなアニメ(GIF): 見守り → さわられて照れる → 電話のあとに話す → 聞いてうなずく → 見守り(最後は最初とつながる) -->
    <div id="root" data-composition-id="loop" data-start="0" data-duration="7.6" data-width="960" data-height="540">
      <div id="loop-bg" class="clip" data-start="0" data-duration="7.6" data-track-index="0"></div>
      <div id="loop-char" class="clip" data-start="0" data-duration="7.6" data-track-index="1">
        <div id="loop-char-in"></div>
      </div>
    </div>
    <script src="assets/rig.js"></script>
    <script src="assets/drive.js"></script>
    <script>
      const env = [];
      for (let i = 0; i < 60; i++) {                       // 2 秒ぶんの口の開き(20 Hz、決まった形)
        const x = (i % 5) / 4;
        env.push(+(i % 13 === 12 ? 0 : 0.35 + 0.6 * Math.sin(Math.PI * x)).toFixed(2));
      }
      const TRACK = {
        moods: [[0, "watch"], [3.0, "after"], [5.2, "listen"], [6.9, "watch"]],
        touch: [[0.9, 1]],
        gaze: [[0, 0], [0.9, -0.5], [1.6, -0.5], [2.4, 0], [5.2, 0], [5.6, 0.6], [6.6, 0.6], [7.2, 0]],
        nod: [6.05],
        speak: [{ t0: 3.55, hz: 20, env }],
      };
      const rig = LanternRig.create(document.getElementById("loop-char-in"), { seed: 11 });
      // rig の時刻は +30 秒ずらす(瞬きなどの乱数を、ちょうど良い所から始める)。状態の時刻もずらす
      function stateShift(t) {
        const s = HFDrive.stateAt(t, TRACK);
        return Object.assign(s, { since: s.since + 30, touchAt: s.touchAt == null ? null : s.touchAt + 30, nodAt: s.nodAt == null ? null : s.nodAt + 30 });
      }
      function draw(t) {
        const s = stateShift(t);
        s.speak = HFDrive.stateAt(t, TRACK).speak;
        rig.render(t + 30, s);
      }
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      draw(0);
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 7.6 }, 0);
      window.__timelines["loop"] = tl;
    </script>
  </body>
</html>
