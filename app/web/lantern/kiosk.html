<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ふすまの中の Claude</title>
<style>
  /* 昼はあたたかいアイボリー。電話のあいだは、温かい茶色を通って、ほとんど黒まで沈む(色は kiosk.js が明るさから決める) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F4F1EA; }
  body { cursor: none; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #bg { position: fixed; inset: 0; background: #F4F1EA; }
  #floor { position: fixed; left: 50%; transform: translateX(-50%); pointer-events: none;
      background: radial-gradient(closest-side, rgba(43, 33, 28, .10), rgba(43, 33, 28, 0)); }
  /* rig の viewBox は 430×304、床は上から 263/304 */
  #stage { position: fixed; left: 50%; top: 50%; width: min(90vw, 124vh); aspect-ratio: 430 / 304; transform: translate(-50%, -60%); }
  .portrait #stage { width: 96vw; }
  #stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #debug { position: fixed; left: 8px; top: 6px; font: 12px/1.3 ui-monospace, Menlo, monospace; color: #8C8476; white-space: pre; display: none; }
  .debug #debug { display: block; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="floor"></div>
<div id="stage"></div>
<div id="debug"></div>
<script src="rig.js"></script>
<script src="kiosk.js"></script>
</body>
</html>
