<text class="m" x="50" y="66" font-size="36" font-weight="800" fill="#24201c" letter-spacing=".04em">相手の声を聞かなくても、会話の「形」は見える</text>
<text class="m" x="50" y="104" font-size="20" font-weight="600" fill="#4a423a">耳が聞くのは祖母の声だけ。祖母が黙っているあいだを、相手が話している時間とみなす。</text>
