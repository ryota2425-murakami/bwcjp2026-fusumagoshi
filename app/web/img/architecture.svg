<text class="m" x="218" y="538" font-size="21" font-weight="800" fill="#c4432c">② 文字と数値だけ ・ 音声 0 バイト</text>
<text class="k" x="218" y="562" font-size="15" font-weight="600" fill="#4a423a">送るたびに台帳に記録(文字数・音声 0 バイト)</text>
<path d="M880 668V484" fill="none" stroke="#24201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="672" y="530" width="200" height="24" rx="3" fill="#f3ead8"/>
<text class="k" x="866" y="547" font-size="16" font-weight="600" fill="#24201c" text-anchor="end">判断と、次の一言(文字)</text>
<path d="M1250 478V674" fill="none" stroke="#24201c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="986" y="530" width="256" height="24" rx="3" fill="#f3ead8"/>
<text class="k" x="1236" y="547" font-size="16" font-weight="600" fill="#24201c" text-anchor="end">要約(カルテ・メモ)と家族の文脈</text>
<text class="k" x="1334" y="535" font-size="15" font-weight="600" fill="#857a6e">↑ 家の中</text>
<text class="k" x="1334" y="557" font-size="15" font-weight="600" fill="#857a6e">↓ 家の外</text>
<rect x="40" y="600" width="890" height="380" rx="14" fill="#2c4a6b" fill-opacity="0.05" stroke="#24201c" stroke-opacity="0.5" stroke-width="1.6"/>
<text class="m" x="224" y="640" font-size="24" font-weight="800" fill="#24201c">③ 脳 — Claude API</text>
<text class="k" x="470" y="640" font-size="16" font-weight="600" fill="#4a423a">ふすまの向こうの家族会議</text>
<g><rect x="64" y="668" width="263" height="192" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="94" cy="700" r="17" fill="none" stroke="#c4432c" stroke-width="2"/><text class="m" x="94" y="706.5" font-size="18" font-weight="800" fill="#c4432c" text-anchor="middle">聞</text>
  <text class="m" x="122" y="707" font-size="22" font-weight="800" fill="#24201c">聞き役</text>
  <text class="m" x="84" y="740" font-size="17" font-weight="700" fill="#4a423a">Claude Haiku 5.5</text>
  <text class="k" x="84" y="772" font-size="16" font-weight="600" fill="#4a423a">通話中も、10 発話か</text>
  <text class="k" x="84" y="796" font-size="16" font-weight="600" fill="#4a423a">60 秒ごとに読む</text>
  <text class="k" x="84" y="822" font-size="16" font-weight="600" fill="#4a423a">段階と怪しい度を、</text>
  <text class="k" x="84" y="846" font-size="16" font-weight="600" fill="#4a423a">決まった書式で返す</text>
</g>
<g><rect x="353" y="668" width="263" height="192" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="383" cy="700" r="17" fill="none" stroke="#c4432c" stroke-width="2"/><text class="m" x="383" y="706.5" font-size="18" font-weight="800" fill="#c4432c" text-anchor="middle">反</text>
  <text class="m" x="411" y="707" font-size="22" font-weight="800" fill="#24201c">反証役</text>
  <text class="m" x="373" y="740" font-size="17" font-weight="700" fill="#4a423a">Claude Sonnet 5.5</text>
  <text class="k" x="373" y="772" font-size="16" font-weight="600" fill="#4a423a">聞き役の結論を見ずに、</text>
  <text class="k" x="373" y="796" font-size="16" font-weight="600" fill="#4a423a">本物の可能性を考える</text>
  <text class="k" x="373" y="822" font-size="16" font-weight="600" fill="#4a423a">怪しいときだけ呼ぶ</text>
  <text class="k" x="373" y="846" font-size="16" font-weight="600" fill="#4a423a">出典を Citations で引く</text>
</g>
<g><rect x="642" y="668" width="264" height="192" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="672" cy="700" r="17" fill="none" stroke="#c4432c" stroke-width="2"/><text class="m" x="672" y="706.5" font-size="18" font-weight="800" fill="#c4432c" text-anchor="middle">ま</text>
  <text class="m" x="700" y="707" font-size="22" font-weight="800" fill="#24201c">まとめ役</text>
  <text class="m" x="662" y="740" font-size="17" font-weight="700" fill="#4a423a">Claude Sonnet 5.5</text>
  <text class="k" x="662" y="772" font-size="16" font-weight="600" fill="#4a423a">記憶と照らして選ぶ</text>
  <text class="k" x="662" y="796" font-size="16" font-weight="600" fill="#4a423a">黙って記録・夕方の便り・</text>
  <text class="k" x="662" y="822" font-size="16" font-weight="600" fill="#4a423a">今すぐ家族へ</text>
  <text class="k" x="662" y="846" font-size="16" font-weight="600" fill="#4a423a">電話のあとの一言も</text>
</g>
