<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
<title>ふすまごしの仕組み: 耳(Mac)→ 文字と数値だけ → 脳(Claude API)→ 電話のあとの会話 → 記憶 → 18:00 の便り係(Managed Agents)→ 家族のスマホ</title>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&amp;family=Klee+One:wght@400;600&amp;display=block');
    .m{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
    .k{font-family:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
  </style>
  <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M2 1.5L10.5 6L2 10.5" fill="none" stroke="#24201c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ahR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M2 1.5L10.5 6L2 10.5" fill="none" stroke="#c4432c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1050" fill="#f3ead8"/>
<!-- モデルと役: app/fusuma/config.py・app/fusuma/brain/*.py・app/managed/agents/fusuma-family/agent.md。
     例の 1 行: 架空の通話 S05 の耳の出力 ear_S05.json(lab/runs/eval/、リポジトリでは eval/ear_cache/)。知識カード: app/knowledge/cards.json -->
<text class="m" x="50" y="58" font-size="32" font-weight="800" fill="#24201c" letter-spacing=".02em">ふすまごしの仕組み — 音は Mac の中、Claude には文字と数値だけ</text>
<rect x="40" y="80" width="1280" height="410" rx="14" fill="#e99a3c" fill-opacity="0.07" stroke="#24201c" stroke-opacity="0.5" stroke-width="1.6"/>
<text class="m" x="64" y="120" font-size="26" font-weight="800" fill="#24201c">祖母の家 — Mac 1 台</text>
<text class="k" x="344" y="120" font-size="16" font-weight="600" fill="#4a423a">音はこの中だけで扱う。電話回線にはつながない</text>
<g><rect x="64" y="140" width="520" height="238" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <text class="m" x="84" y="176" font-size="24" font-weight="800" fill="#24201c">① 耳</text>
  <text class="k" x="150" y="176" font-size="16" font-weight="600" fill="#4a423a">部屋のマイクで聞く。相手の声は聞かない</text>
  <g><rect x="84" y="192" width="233" height="80" rx="4" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="m" x="100" y="224" font-size="19" font-weight="700" fill="#24201c">呼出音・受話器の音</text>
  <text class="k" x="100" y="252" font-size="16" font-weight="600" fill="#4a423a">YAMNet(ONNX)+ 登録音</text>
</g>
  <g><rect x="331" y="192" width="233" height="80" rx="4" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="m" x="347" y="224" font-size="19" font-weight="700" fill="#24201c">声の区間</text>
  <text class="k" x="347" y="252" font-size="16" font-weight="600" fill="#4a423a">Silero VAD</text>
</g>
  <g><rect x="84" y="284" width="233" height="80" rx="4" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="m" x="100" y="316" font-size="19" font-weight="700" fill="#24201c">文字起こし</text>
  <text class="k" x="100" y="344" font-size="16" font-weight="600" fill="#4a423a">whisper.cpp(Metal)</text>
</g>
  <g><rect x="331" y="284" width="233" height="80" rx="4" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="m" x="347" y="316" font-size="19" font-weight="700" fill="#24201c">声の様子と「間」</text>
  <text class="k" x="347" y="344" font-size="16" font-weight="600" fill="#4a423a">Praat・いつもの声との差</text>
</g>
</g>
<g><rect x="64" y="390" width="520" height="88" rx="3" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <text class="k" x="84" y="412" font-size="15" font-weight="600" fill="#4a423a">Claude に渡す 1 行(例・架空の通話 S05)</text>
  <text class="m" x="84" y="440" font-size="20" font-weight="700" fill="#24201c">14:04:38 祖母「じゃあお願いします。」</text>
  <text class="m" x="84" y="466" font-size="20" font-weight="700" fill="#24201c">間6.8s 声高-25% 声量-7dB 話速-14%</text>
</g>
<rect x="64" y="390" width="6" height="88" fill="#c4432c"/>
<g><rect x="620" y="140" width="310" height="338" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <text class="m" x="640" y="176" font-size="22" font-weight="800" fill="#24201c">④ 電話のあとの会話</text>
  <rect x="648" y="203" width="62" height="112" fill="#e99a3c" fill-opacity="0.55" stroke="#24201c" stroke-width="2"/><path d="M679 203V315M648 240.333H710M648 277.667H710" stroke="#24201c" stroke-opacity=".55" stroke-width="1.5"/><rect x="645" y="203" width="5" height="112" fill="#4a423a"/><rect x="708" y="203" width="5" height="112" fill="#4a423a"/><rect x="643" y="194" width="72" height="9" rx="2" fill="#4a423a"/><rect x="643" y="315" width="72" height="9" rx="2" fill="#4a423a"/><rect x="650" y="324" width="7" height="10" fill="#4a423a"/><rect x="701" y="324" width="7" height="10" fill="#4a423a"/>
  <text class="k" x="738" y="228" font-size="18" font-weight="600" fill="#24201c">「そういえば、</text>
  <text class="k" x="738" y="254" font-size="18" font-weight="600" fill="#24201c">さっきの電話、</text>
  <text class="k" x="738" y="280" font-size="18" font-weight="600" fill="#24201c">なんだったの?」</text>
  <text class="k" x="738" y="312" font-size="14.5" font-weight="600" fill="#857a6e">最初の一言は、いつも同じ</text>
  <text class="m" x="640" y="380" font-size="18" font-weight="700" fill="#24201c">行灯の声で、ひとつずつ聞く</text>
  <text class="k" x="640" y="410" font-size="15" font-weight="600" fill="#4a423a">声は Mac の中で合成(Qwen3-TTS)</text>
  <text class="k" x="640" y="434" font-size="15" font-weight="600" fill="#4a423a">通話中は光らない・話さない</text>
</g>
<g><rect x="960" y="140" width="340" height="338" rx="8" fill="#f8f1e2" stroke="#24201c" stroke-opacity="0.55" stroke-width="1.6"/>
  <text class="m" x="980" y="176" font-size="22" font-weight="800" fill="#24201c">⑤ 記憶</text>
  <text class="k" x="1062" y="176" font-size="15" font-weight="600" fill="#4a423a">SQLite。Mac の中が正本</text>
  <g><rect x="980" y="196" width="300" height="72" rx="2" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="m" x="996" y="224" font-size="18" font-weight="700" fill="#24201c">通話カルテ</text>
  <text class="k" x="996" y="250" font-size="14.5" font-weight="600" fill="#4a423a">1 本ごとの要約と、まとめ役の判断</text>
</g>
  <g><rect x="980" y="282" width="300" height="72" rx="2" fill="#fbf6ec" stroke="#24201c" stroke-opacity="0.4" stroke-width="1.6"/>
  <text class="m" x="996" y="310" font-size="18" font-weight="700" fill="#24201c">暮らしのメモ</text>
  <text class="k" x="996" y="336" font-size="14.5" font-weight="600" fill="#4a423a">祖母が話したこと(膝、畑の大根…)</text>
</g>
  <text class="k" x="980" y="386" font-size="15" font-weight="600" fill="#4a423a">音声は残さない。</text>
  <text class="k" x="980" y="410" font-size="15" font-weight="600" fill="#4a423a">文字起こしは、判断が出たら消す。</text>
  <text class="k" x="980" y="434" font-size="15" font-weight="600" fill="#4a423a">問いかける電話は、会話が終わってから。</text>
</g>
